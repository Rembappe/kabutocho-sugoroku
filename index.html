<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>浦島太郎投資伝説</title>
<meta name="description" content="竜宮城の取引所で株を売り買いして資産を増やす、すごろく式の投資学習ゲーム。友達とオンラインで対戦できる。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

/* レイアウト：上に1年分のすごろく盤（暦）、下に株価ボードと銘柄カルテ。大事件は竜宮新報の「号外」が割り込む */
:root{
  --paper:#E8ECF0;--card:#F9FAFB;--ink:#16202D;--muted:#596572;--line:#C5CDD6;--grid:#DCE2E8;
  --board:#13202F;--board2:#1C2C40;--boardline:#2A3C52;--led:#E6ECF2;--ledmute:#8C9DB0;
  --up:#C42F25;--down:#2459AD;--upL:#FF6B5D;--downL:#64A9FF;--gold:#D9981A;--goldsoft:#F5E6C0;
  --shade:rgba(36,89,173,.10);--shade2:rgba(196,47,37,.13);
  --sq:#DCE3EA;--sqpast:#CBD4DD;--sqnow:#FFFFFF;
  --newsprint:#EDEBE5;--newsink:#1B1B1B;--newsred:#B8261C;
  --p1:#C42F25;--p2:#2459AD;--p3:#C78512;--p4:#2B8A5E;--p5:#7B4FB0;--p6:#1E8C9C;--p7:#B0457A;--p8:#6B7280;
  --disp:'Dela Gothic One','Zen Kaku Gothic New',sans-serif;
  --num:'DotGothic16','Zen Kaku Gothic New',monospace;
  --sans:'Zen Kaku Gothic New','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0E141B;--card:#17202A;--ink:#E5EAF0;--muted:#97A3B0;--line:#2B3744;--grid:#243040;
  --up:#FF6B5D;--down:#64A9FF;--goldsoft:#3A3020;--shade:rgba(100,169,255,.12);--shade2:rgba(255,107,93,.14);
  --sq:#1E2935;--sqpast:#141C25;--sqnow:#2C3C50;color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0E141B;--card:#17202A;--ink:#E5EAF0;--muted:#97A3B0;--line:#2B3744;--grid:#243040;
  --up:#FF6B5D;--down:#64A9FF;--goldsoft:#3A3020;--shade:rgba(100,169,255,.12);--shade2:rgba(255,107,93,.14);
  --sq:#1E2935;--sqpast:#141C25;--sqnow:#2C3C50;color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.6}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
h1,h2,h3{text-wrap:balance}
.wrap{max-width:1240px;margin:0 auto;padding-inline:16px;padding-block:16px}
.up{color:var(--up)}.down{color:var(--down)}
.board .up{color:var(--upL)}.board .down{color:var(--downL)}
.num{font-family:var(--num);font-variant-numeric:tabular-nums}
.spacer{flex:1}
.linkbtn{background:none;border:none;color:var(--muted);text-decoration:underline;padding:4px}

/* header */
.top{display:flex;flex-wrap:wrap;align-items:center;gap:8px 20px;padding-bottom:10px}
.logo{font-family:var(--disp);font-weight:400;font-size:24px;margin:0;letter-spacing:.04em}
.date{font-family:var(--num);font-size:26px;line-height:1}
.date small{font-size:14px;color:var(--muted);margin-left:8px}
.pill{display:inline-block;padding:2px 10px;border-radius:999px;font-weight:700;font-size:12px;border:1px solid var(--line)}
.pill.bad{background:var(--up);color:#fff;border-color:var(--up)}
.pill.warn{background:var(--goldsoft);border-color:var(--gold)}

/* すごろく盤 */
.track{position:relative;background:var(--card);border:2px solid var(--ink);border-radius:10px;padding:10px;margin-bottom:12px}
.track ol{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:4px}
.sq{position:relative;min-height:52px;background:var(--sq);border-radius:5px;padding:3px 4px;font-size:11px;line-height:1.25;overflow:hidden}
.sq.past{background:var(--sqpast);color:var(--muted)}
.sq.now{background:var(--sqnow);outline:3px solid var(--gold);z-index:1}
.sq .mo{font-weight:900;font-size:12px;display:block}
.sq .hf{color:var(--muted);font-size:10px}
.sq .bd{display:inline-block;font-size:10px;font-weight:700;padding:0 3px;border-radius:3px;margin-right:2px;background:var(--line);color:var(--ink)}
.sq .bd.e{background:var(--ink);color:var(--paper)}
.sq .bd.d{background:var(--gold);color:#1B1B1B}
.sq .bd.n{background:var(--down);color:#fff}
.sq .ev{display:block;font-weight:700;font-size:10px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sq .ev.bad{color:var(--down)}.sq .ev.good{color:var(--up)}
.tok{display:flex;gap:2px;position:absolute;right:3px;bottom:3px}
.tok i{width:15px;height:15px;border-radius:50%;font-style:normal;font-size:9px;font-weight:900;color:#fff;display:grid;place-items:center;border:1.5px solid var(--card)}
.trackleg{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--muted);margin-top:8px}
.yrlabel{font-family:var(--num);font-size:13px;color:var(--muted);margin-bottom:6px}
@media (max-width:640px){.track ol{grid-template-columns:repeat(6,minmax(0,1fr))}}
@media (prefers-reduced-motion:no-preference){
  .sq.now.land{animation:land .7s cubic-bezier(.3,1.6,.5,1)}
  @keyframes land{0%{transform:translateY(-14px) scale(1.08)}100%{transform:none}}
  .extra .paper{animation:drop .45s ease-out}
  @keyframes drop{from{transform:rotate(-4deg) translateY(-30px);opacity:0}to{transform:rotate(-1deg);opacity:1}}
}

/* players & nav */
.players{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px}
.pl{flex:0 0 auto;min-width:170px;padding:6px 12px;border:1px solid var(--line);border-radius:6px;background:var(--card)}
.pl.on{border:2px solid var(--ink)}
.pl.bust{opacity:.45}
.pl b{display:flex;align-items:center;gap:6px;font-size:13px}
.pl .v{font-family:var(--num);font-size:18px}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block}
.nav{display:flex;gap:2px;border-bottom:2px solid var(--ink);margin-bottom:14px;overflow-x:auto}
.nav button{background:none;border:none;border-radius:6px 6px 0 0;padding:8px 16px;font-weight:700;color:var(--muted)}
.nav button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}

/* layout */
.main{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:16px;align-items:start}
.main>*{min-width:0}
@media (max-width:920px){.main{grid-template-columns:1fr}}
.cols2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr));gap:16px;align-items:start}

/* board */
.board{background:var(--board);color:var(--led);border-radius:8px;padding:10px 10px 4px}
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:8px}
.tabs button{background:transparent;border:1px solid #33465D;color:var(--ledmute);border-radius:4px;padding:3px 12px;font-size:13px}
.tabs button[aria-pressed="true"]{background:var(--led);color:var(--board);border-color:var(--led);font-weight:700}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%}
.board th{font-weight:500;font-size:12px;color:var(--ledmute);text-align:right;padding:4px 8px;border-bottom:1px solid var(--boardline);white-space:nowrap}
.board th:first-child{text-align:left}
.board td{padding:7px 8px;border-bottom:1px solid #1F3045;text-align:right;white-space:nowrap}
.board td:first-child{text-align:left}
.board tr.row{cursor:pointer}
.board tr.row:hover td{background:var(--board2)}
.board tr.sel td{background:#26405E}
.nm{font-weight:700}
.sec{display:block;font-size:11px;color:var(--ledmute);font-weight:400}
.px{font-family:var(--num);font-size:17px}
.usd{display:block;font-size:11px;color:var(--ledmute);font-family:var(--num)}
.held{font-family:var(--num);color:var(--gold)}
.pe{font-family:var(--num);font-size:13px}
.pe.hi{color:var(--upL)}.pe.lo{color:var(--downL)}

/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px 16px;margin-bottom:16px;min-width:0}
.card h2{font-size:17px;margin:0 0 8px}
.card h3{font-size:14px;margin:14px 0 6px}
.desc{color:var(--muted);font-size:13px;margin:0 0 8px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:2px 14px;font-size:13px;margin:8px 0}
.stats div{display:flex;justify-content:space-between;gap:8px;border-bottom:1px dotted var(--line);padding:2px 0}
.stats span:last-child{font-family:var(--num);text-align:right}
@media (max-width:420px){.stats{grid-template-columns:1fr}}
.seg{display:flex;flex-wrap:wrap;gap:4px;margin:10px 0 4px}
.seg button{border:1px solid var(--line);background:transparent;border-radius:4px;padding:4px 10px;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink);font-weight:700}
.seg button:disabled{opacity:.35;cursor:not-allowed}
.trade{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:8px}
.trade input{width:110px;padding:8px;border:1px solid var(--line);border-radius:4px;background:var(--paper);font-family:var(--num);font-size:16px}
.btn{border:none;border-radius:4px;padding:9px 16px;font-weight:700}
.btn.buy{background:var(--up);color:#fff}
.btn.sell{background:var(--down);color:#fff}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn.dark{background:var(--ink);color:var(--paper)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.hint{font-size:12px;color:var(--muted);margin:6px 0 0}
.msg{font-size:13px;margin-top:6px;min-height:1.2em}
.msg.err{color:var(--up)}
.holds{font-size:12px;display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:6px}

/* charts */
.ch{position:relative;width:100%;min-height:60px;margin:6px 0}
.ch svg{display:block;width:100%;touch-action:pan-y}
.ch .ax{font-size:11px;fill:var(--muted);font-family:var(--num)}
.ch .tip{position:absolute;top:4px;pointer-events:none;background:var(--ink);color:var(--paper);font-size:12px;padding:4px 8px;border-radius:4px;max-width:220px;line-height:1.4}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:16px;height:0;border-top:2px solid;vertical-align:middle;margin-right:4px}
.legend i.dash{border-top-style:dashed}
.legend i.box{height:10px;border:none}
.rng{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.rng button{border:1px solid var(--line);background:transparent;border-radius:999px;padding:1px 10px;font-size:12px}
.rng button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}

/* 業績 */
.earn{display:flex;align-items:flex-end;gap:4px;height:84px;margin-top:4px}
.earn div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:2px;min-width:0;height:100%}
.earn b{display:block;width:100%;border-radius:2px 2px 0 0;background:var(--line)}
.earn b.beat{background:var(--up)}.earn b.miss{background:var(--down)}
.earn span{font-size:10px;color:var(--muted);font-family:var(--num);white-space:nowrap}

/* news */
.news{list-style:none;margin:0;padding:0}
.news li{border-left:4px solid var(--gold);padding:6px 10px;margin:0 0 10px;background:var(--paper);border-radius:0 4px 4px 0}
.news li.bad{border-left-color:var(--down)}
.news li.good{border-left-color:var(--up)}
.news li.me{border-left-color:var(--ink)}
.news .tag{font-size:11px;font-weight:700;color:var(--muted)}
.news .ttl{font-weight:700;display:block}
.news details{font-size:13px;margin-top:4px}
.news summary{cursor:pointer;color:var(--muted)}
.moves{font-size:12px;margin-top:4px;display:flex;flex-wrap:wrap;gap:4px 12px}
.prec{font-size:12px;color:var(--muted)}

/* coach */
.coach{border:2px solid var(--gold)}
.coach .step{font-family:var(--num);font-size:13px;color:var(--gold)}
.coach p{margin:6px 0;font-size:14px}
.coach .ex,.box{background:var(--paper);border-radius:4px;padding:8px 10px;margin:8px 0;font-size:14px}
.coach .ex b{display:block;font-size:12px;color:var(--muted)}
.lk{background:none;border:none;padding:0;font-weight:700;color:inherit;text-decoration:underline;text-decoration-color:var(--gold);text-underline-offset:3px}
.coachbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px}
.coachbar .btn{padding:6px 12px;font-weight:500}

/* NISA */
.meter{margin:8px 0}
.meter .lb{display:flex;justify-content:space-between;font-size:13px;gap:8px}
.meter .lb span:last-child{font-family:var(--num)}
.meter .bar{height:10px;background:var(--paper);border-radius:5px;overflow:hidden;border:1px solid var(--line)}
.meter .bar i{display:block;height:100%;background:var(--gold)}
.rtbl{width:100%;font-size:13px;border-collapse:collapse}
.rtbl th,.rtbl td{border-bottom:1px solid var(--line);padding:6px 6px;text-align:left;vertical-align:top}
.rtbl th{white-space:nowrap;color:var(--muted);font-weight:700}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.form label{display:block;font-size:12px;font-weight:700;color:var(--muted)}
.form input{width:100%;padding:7px;border:1px solid var(--line);border-radius:4px;background:var(--paper);font-family:var(--num)}
.big{font-family:var(--num);font-size:22px}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin:8px 0}
.kv div{background:var(--paper);border-radius:4px;padding:6px 10px}
.kv small{display:block;font-size:11px;color:var(--muted)}

/* bar */
.bar{position:sticky;bottom:0;background:var(--paper);border-top:2px solid var(--ink);padding-block:12px calc(12px + env(safe-area-inset-bottom,0px));margin-top:8px;display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;z-index:5}
.bar .who{font-weight:700}
.bar .cash{font-family:var(--num);font-size:18px}
.go{background:var(--ink);color:var(--paper);border:none;border-radius:6px;padding:12px 26px;font-size:17px;font-family:var(--disp);letter-spacing:.05em}

/* 号外 */
.extra{position:fixed;inset:0;background:rgba(10,14,20,.6);display:grid;place-items:center;padding:16px;z-index:20}
.paper{background:var(--newsprint);color:var(--newsink);max-width:560px;width:100%;border-radius:2px;padding:18px 20px;transform:rotate(-1deg);box-shadow:0 10px 40px rgba(0,0,0,.35);display:grid;grid-template-columns:auto 1fr;gap:14px;max-height:90vh;overflow:auto}
.paper .gougai{writing-mode:vertical-rl;font-family:var(--disp);font-size:44px;line-height:1;color:var(--newsred);border:3px solid var(--newsred);padding:8px 4px;align-self:start}
.paper h2{font-family:var(--disp);font-weight:400;font-size:26px;line-height:1.3;margin:0 0 8px}
.paper p{margin:6px 0;font-size:14px}
.paper .src{font-size:12px;opacity:.75}
.paper .btn{background:var(--newsink);color:var(--newsprint);margin-top:8px}
.paper .moves span{font-weight:700}
.paper .up{color:var(--newsred)}.paper .down{color:#1F4E9A}

/* setup */
.setup{max-width:660px;margin:0 auto}
.hero{background:var(--board);color:var(--led);border-radius:10px;padding:26px 22px;margin-bottom:18px;overflow:hidden}
.hero h1{font-family:var(--disp);font-size:42px;line-height:1.15;margin:0 0 8px;font-weight:400}
.hero p{margin:0;color:var(--ledmute)}
.ticker{font-family:var(--num);white-space:nowrap;margin-top:16px;font-size:15px;overflow:hidden}
.ticker span{margin-right:22px}
.field{margin-bottom:14px}
.field>label{display:block;font-weight:700;margin-bottom:4px}
.field select,.field .names input{width:100%;padding:9px;border:1px solid var(--line);border-radius:4px;background:var(--card)}
.names{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chk{display:flex;gap:8px;align-items:center;font-weight:400}
.rules{font-size:14px}
.rules li{margin-bottom:4px}

/* end */
.rank{width:100%;border-collapse:collapse;font-size:14px}
.rank th,.rank td{padding:8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
.rank th:nth-child(-n+2),.rank td:nth-child(-n+2){text-align:left}
.lesson{background:var(--paper);border-radius:4px;padding:8px 12px;margin:6px 0;font-size:14px}

/* オンライン対戦 */
.txt{width:100%;padding:9px;border:1px solid var(--line);border-radius:4px;background:var(--card)}
.sess{display:flex;flex-wrap:wrap;gap:8px}
.code{font-size:13px;color:var(--muted)}
.code b{font-size:17px;color:var(--ink);letter-spacing:.08em}
.sel{user-select:all;word-break:break-all}
.wait{font-weight:700;color:var(--muted)}
.pl .st{margin-left:auto;font-size:11px;font-weight:700;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:0 6px}
.pl.done .st{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.go:disabled{opacity:.5;cursor:wait}
.go.gold{background:var(--gold);color:#1B1B1B;margin-top:16px}
.box-hero{text-align:left}

</style>
</head>

/* ===================== 乱数（部屋ごとのシードで全員が同じ相場を見る） ===================== */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

/* ===================== 状態 ===================== */
let G=null;        // 相場（シードから毎回同じものが再現される）
let ROOM=null;     // 部屋の設定と進行
let PLAYERS={};    // 全員の口座（id→データ）
let OWNED=[];      // この端末で操作する人のid
let MEID=null;     // 今操作している人
let ME=null;
let STORE=null,MODE=null,UNSUB=[];

const pxJ=id=>G.st[id].p*(S[id].c==='US'?G.fx:1);
const pxJh=(id,i)=>G.st[id].h[i]*(S[id].c==='US'?G.fxH[i]:1);
const pxAt=(id,t)=>pxJh(id,t+PRE);
const idxNow=()=>G.fxH.length-1;
function dateOf(t){const k=Math.floor(t/2);return {y:2027+Math.floor(t/24),m:((k%12)+12)%12+1,w:((t%2)+2)%2+1}}
const dstr=t=>{const d=dateOf(t);return `${d.y}年${d.m}月${HALF(d.w)}`};
function match(m,s){if(m.mkt)return s.c===m.mkt&&s.sec!=='gold';if(m.sector)return s.sec===m.sector;if(m.id)return s.id===m.id;return false}

function buildMarket(seed){
 const st={};
 for(const s of STOCKS){
   if(s.sec==='gold')st[s.id]={p:s.p*Math.exp(-.05*PRE/24),h:[],e:[],q:[],ev:[]};
   else{const eps=s.p/s.pe*Math.exp(-s.g*PRE/24);st[s.id]={eps,per:s.pe,p:eps*s.pe,h:[],e:[],q:[],ev:[]};}
 }
 G={seed,rng:mulberry32(seed),t:-PRE,fx:140,fxH:[],cycH:[],tri:[],st,regime:null,drifts:[],pending:[],log:[],major:[],marks:{},
   cyc:{phase:'exp',age:30},newsByT:{},divByT:{},_divJ:0};
 record();
 while(G.t<0)mstep();
 G.newsByT[0]=[{mood:'',tag:'開場',title:'取引開始。まずは気になる銘柄を選んで、長期チャートと業績を見てみよう',explain:'1ターン＝2週間、1ヶ月は前半・後半の2ターン。売買はいつでも何度でもでき、全員が「このターンを終える」を押すと相場が動く。チャートにはゲーム開始前5年分の歴史も入っている。',prec:''}];
}
function extendTo(t){while(G.t<t)mstep()}
function record(){
 for(const s of STOCKS){const x=G.st[s.id];x.h.push(x.p);x.e.push(x.eps??null)}
 G.fxH.push(G.fx);
 G.cycH.push(G.regime?2:G.cyc.phase==='rec'?1:0);
 const n=G.tri.length,p=G.st.jpidx.p;
 G.tri.push(n?G.tri[n-1]*(p+G._divJ)/G.st.jpidx.h[n-1]:1);G._divJ=0;
}
const curNews=()=>G.newsByT[G.t]||[];

function applyEvent(e){
 const before=Object.fromEntries(STOCKS.map(s=>[s.id,pxJ(s.id)]));
 for(const im of (e.imp||[]))for(const s of STOCKS)if(match(im,s)){
   const f=Math.max(im.mkt?1+im.pct*s.b:1+im.pct,.02),x=G.st[s.id];
   if(s.sec==='gold'){x.p*=f;continue}
   if(im.f)x.eps*=f;else x.per*=f;
   x.p=x.eps*x.per;
 }
 if(e.fx)G.fx*=1+e.fx;
 for(const d of (e.drift||[])){const w=Math.max(1,Math.round(d.w/2));G.drifts.push({m:d.m,pw:d.pw*d.w/w,w})}
 if(e.regime)G.regime={type:e.regime.type,w:Math.ceil(e.regime.w/2)};
 if(e.endRegime)G.regime=null;
 for(const p of (e.pending||[]))G.pending.push({at:G.t+Math.max(1,Math.round(p.in/2)),kind:p.kind,id:p.id});
 const moves=STOCKS.map(s=>({id:s.id,pct:pxJ(s.id)/before[s.id]-1})).filter(x=>Math.abs(x.pct)>.004)
   .sort((a,b)=>Math.abs(b.pct)-Math.abs(a.pct));
 for(const m of moves)if(Math.abs(m.pct)>.03)G.st[m.id].ev.push({t:G.t,tag:e.tag,title:e.title});
 return {mood:e.mood,tag:e.tag,title:e.title,explain:e.explain,prec:e.prec,moves:moves.slice(0,5),fxMove:e.fx||0};
}

/* ===================== 相場を1ターン進める（プレイヤーには触らない） ===================== */
function mstep(){
 G.t++;
 const news=[],live=G.t>0,{m,w}=dateOf(G.t);
 // 景気の波（拡大は平均4年ほど、後退は1年弱）
 const c=G.cyc;c.age++;
 if(c.phase==='exp'&&R()<(c.age>36?1/70:1/160)){c.phase='rec';c.age=0;news.push({...CYCLE_NEWS.rec})}
 else if(c.phase==='rec'&&R()<(c.age>8?1/12:1/40)){c.phase='exp';c.age=0;news.push({...CYCLE_NEWS.exp})}
 const crisis=!!G.regime,rec=c.phase==='rec';
 // 市場全体の気分（PER）の揺れ
 let sJ=.15,sU=.15;if(crisis){sJ*=1.7;sU*=1.7}else if(rec){sJ*=1.25;sU*=1.25}
 const z1=randn(),z2=.6*z1+.8*randn(),dm=(crisis?-.15:0)+(rec?-.06:0);
 const mJ=dm*DT+sJ*Math.sqrt(DT)*z1,mU=dm*DT+sU*Math.sqrt(DT)*z2;
 const sf={};for(const k in SECTORS)sf[k]=(k==='index'||k==='gold')?0:.09*Math.sqrt(DT)*randn();
 const startJ=Object.fromEntries(STOCKS.map(s=>[s.id,pxJ(s.id)]));
 for(const s of STOCKS){const x=G.st[s.id];
   if(s.sec==='gold'){x.p*=Math.exp((.05+(crisis?.12:0))*DT+.15*Math.sqrt(DT)*randn());continue}
   // 利益（EPS）：会社ごとの成長＋景気の波
   const ge=s.g+(rec?-.20*s.cy:.04*s.cy)+(crisis?-.15*s.cy:0);
   x.eps*=Math.exp(ge*DT+(.04+s.v*.1)*Math.sqrt(DT)*randn());
   // PER：市場の気分。行き過ぎるとゆっくり平均に戻る
   let lp=s.b*(s.c==='JP'?mJ:mU)+sf[s.sec]+s.v*(crisis?1.5:1)*Math.sqrt(DT)*randn()+.35*DT*Math.log(s.pm/x.per)+s.y*DT;
   for(const d of G.drifts)if(match(d.m,s))lp+=Math.log(1+(d.m.mkt?d.pw*s.b:d.pw));
   x.per=Math.min(300,Math.max(3,x.per*Math.exp(lp)));
   x.p=x.eps*x.per;
 }
 G.fx*=Math.exp(.09*Math.sqrt(DT)*randn()+.4*DT*Math.log(145/G.fx)+(crisis?-.002:0));
 G.drifts.forEach(d=>d.w--);G.drifts=G.drifts.filter(d=>d.w>0);
 if(G.regime){G.regime.w--;if(G.regime.w<=0){G.regime=null;news.push({mood:'good',tag:'市況',title:'市場の混乱がひとまず落ち着く',explain:'恐怖が和らぐと値動きは普段の大きさに戻っていく。',prec:''})}}
 // 予定されていた出来事
 const due=G.pending.filter(p=>p.at<=G.t);G.pending=G.pending.filter(p=>p.at>G.t);
 for(const p of due){const e=resolvePending(p);if(e)news.push(applyEvent(e))}
 // ランダムなニュース
 let fired=0;
 for(const ev of EVENTS.slice().sort(()=>R()-.5)){
   if(fired>=2)break;
   if(R()<ev.p*3.2){const e=ev.make();if(e){news.push(applyEvent(e));fired++}}
 }
 // 決算
 const earn=[];
 for(const s of STOCKS){
   if(!NONIDX(s)||!EARN_MONTHS[s.c].includes(m)||earnWeek(s)!==w)continue;
   const x=G.st[s.id],z=randn(),sens=.02+s.v*.10;let pct=z*sens,twist=false;
   const kind=z>.8?'予想を上回る好決算':z<-.8?'予想を下回る決算':'ほぼ予想通りの決算';
   x.eps*=1+Math.max(pct,-.5);
   if(z>.8&&R()<.18){x.per*=1-Math.abs(pct)*1.5;twist=true}
   x.p=x.eps*x.per;
   const prev=x.q.length>=4?x.q[x.q.length-4].eps:null;
   x.q.push({t:G.t,eps:x.eps,yoy:prev?x.eps/prev-1:null,sur:z>.8?'beat':z<-.8?'miss':'in'});
   const move=(1+Math.max(pct,-.5))*(twist?1-Math.abs(pct)*1.5:1)-1;
   if(Math.abs(move)>.05)x.ev.push({t:G.t,tag:'決算',title:`${s.name}：${kind}${twist?'なのに下落':''}`});
   earn.push({s,kind,pct:move,twist});
 }
 if(earn.length){
   const tw=earn.some(e=>e.twist);
   news.push({mood:'',tag:'決算',title:'決算発表：'+earn.map(e=>`${e.s.name}（${e.kind}${e.twist?'なのに下落':''}）`).join('、'),
     explain:'株価は「結果」ではなく「予想とのズレ」で動く。予想通りなら大きくは動かない。決算で変わるのは会社の稼ぐ力（利益）なので、その分は時間がたっても戻りにくい。'+(tw?'好決算でも下がったのは「材料出尽くし」。期待で先に買われていた分、発表と同時に売られた。':''),
     prec:'日本企業は2・5・8・11月、米国企業は1・4・7・10月に決算が集中する',moves:earn.map(e=>({id:e.s.id,pct:e.pct}))});
 }
 // 配当（日本株は3・9月、米国株は3・6・9・12月の後半に権利確定）。1株あたりの金額を記録し、各自の口座はあとで反映
 if(w===2&&m%3===0){
   const paysJP=m===3||m===9,divs=[];
   for(const s of STOCKS){if(!s.y)continue;
     const d=s.c==='JP'?(paysJP?s.y/2:0):s.y/4;if(!d)continue;
     const ps=pxJ(s.id)*d;divs.push({id:s.id,ps});
     if(s.id==='jpidx')G._divJ=G.st.jpidx.p*d;
     const x=G.st[s.id];x.per*=1-d;x.p=x.eps*x.per;
   }
   G.divByT[G.t]=divs;
   if(divs.length)news.push({mood:'',tag:'配当',title:`配当の権利確定。${paysJP?'日本株と米国株':'米国株'}の保有者に配当金が入金`,
     explain:'配当をもらう権利が確定すると、その分だけ株価が下がる（権利落ち）。特定口座では配当にも20.315%の税金がかかり、NISAなら非課税。米国株の配当は米国で10%が先に引かれる。',prec:''});
 }
 if(live&&m===1&&w===1)news.push({mood:'good',tag:'NISA',title:'新しい年。NISAの年間投資枠がリセットされた',explain:'つみたて投資枠120万円、成長投資枠240万円が新たに使える。去年NISAで売った分の枠（買ったときの金額ぶん）も今年から復活した。特定口座の損益と税金の計算も年ごとに区切られる。',prec:''});
 record();
 if(!news.length&&live){
   const j=pxJ('jpidx')/startJ.jpidx-1,u=pxJ('usidx')/startJ.usidx-1;
   news.push({mood:'',tag:'市況',title:`この2週間は目立った材料なし。日本株 ${pc(j)}、米国株（円換算） ${pc(u)}`,explain:'ニュースがなくても株価は毎回動く。小さな値動きに一喜一憂しすぎないのも大事。',prec:''});
 }
 for(const n of news)if(n.tag!=='市況'&&n.tag!=='決算'&&n.tag!=='配当'&&n.tag!=='NISA')G.log.unshift({...n,t:G.t});
 G.log=G.log.slice(0,80);
 for(const n of news)if(isMajor(n))G.major.unshift({t:G.t,title:n.title,tag:n.tag});
 const top=news.find(isMajor)||news.find(n=>!['市況','決算','配当','NISA'].includes(n.tag));
 if(top)G.marks[G.t]={tag:top.tag,mood:top.mood,title:top.title};
 if(live)G.newsByT[G.t]=news;
}

/* ===================== 口座・税金・NISA ===================== */
function newPlayer(name,pin,cash,t,color){return {name,pin,cash,hold:{},hist:[cash],t,joinT:t,start:cash,trades:0,fees:0,bust:false,divs:0,color,
  tax:{yrGain:0,yrPaid:0,total:0,saved:0},nisa:{yT:0,yS:0,pendT:0,pendS:0},plan:{jpidx:0,usidx:0},notes:[],coachOff:false}}
function holds(pl){return Object.entries(pl.hold).map(([k,h])=>{const [a,id]=k.split(':');return {k,a,id,sh:h.sh,cost:h.cost}})}
function holdOf(pl,id){let sh=0,cost=0;for(const x of holds(pl))if(x.id===id){sh+=x.sh;cost+=x.cost}return sh>1e-9?{sh,cost}:null}
function valueAt(pl,t){let v=pl.cash;for(const x of holds(pl))v+=x.sh*pxAt(x.id,t);return v}
function value(pl){let v=pl.cash;for(const x of holds(pl))v+=x.sh*pxJ(x.id);return v}
function benchOf(pl){const i=G.t+PRE,j=pl.joinT+PRE;return pl.start*G.tri[i]/G.tri[j]}
function nisaBook(pl){let T=pl.nisa.pendT,Sg=pl.nisa.pendS;for(const x of holds(pl)){if(x.a==='tsumi')T+=x.cost;if(x.a==='seicho')Sg+=x.cost}return {T,S:Sg}}
function nisaRoom(pl,a){const b=nisaBook(pl),life=NISA_LIM.life-b.T-b.S;
 if(a==='tsumi')return Math.max(0,Math.min(NISA_LIM.yT-pl.nisa.yT,life));
 if(a==='seicho')return Math.max(0,Math.min(NISA_LIM.yS-pl.nisa.yS,NISA_LIM.lifeS-b.S,life));
 return Infinity}
// 特定口座（源泉徴収あり）：その年の損益を合計し、税金を差し引き・還付する
function realize(pl,x){const t=pl.tax;t.yrGain+=x;const due=Math.max(0,t.yrGain)*TAX,d=due-t.yrPaid;pl.cash-=d;t.yrPaid=due;t.total+=d;return d}
const acctOK=(s,a)=>a==='tok'||(a==='tsumi'?s.sec==='index':s.sec!=='gold');
const fsh=x=>Number.isInteger(x)?String(x):x.toFixed(2);

// 相場が進んだ分だけ、自分の口座に配当・積立・年替わりを反映する
function catchUp(pl,T){
 if(pl.t>=T)return false;
 const notes=[],multi=T-pl.t>1;
 for(let t=pl.t+1;t<=T;t++){
   const {m,w}=dateOf(t),pre=multi?`${dstr(t)}：`:'';
   if(!pl.bust){
     for(const dv of (G.divByT[t]||[]))for(const h of holds(pl))if(h.id===dv.id){
       let amt=h.sh*dv.ps;if(S[dv.id].c==='US')amt*=.9; // 米国で10%源泉徴収
       pl.cash+=amt;pl.divs+=amt;
       if(h.a==='tok')realize(pl,amt);else pl.tax.saved+=amt*TAX;
     }
     if(m===1&&w===1){pl.nisa.yT=0;pl.nisa.yS=0;pl.nisa.pendT=0;pl.nisa.pendS=0;pl.tax.yrGain=0;pl.tax.yrPaid=0}
     if(w===1)for(const id of ['jpidx','usidx']){const amt=pl.plan[id];if(!amt)continue;
       const room=nisaRoom(pl,'tsumi'),use=Math.min(amt,room);
       if(use<1000){notes.push(`${pre}${S[id].name}の積立は、つみたて投資枠が今年いっぱいのため見送り`);continue}
       if(pl.cash<use){notes.push(`${pre}現金が足りず、${S[id].name}の積立（${yen(use)}）を見送り`);continue}
       const sh=use/pxAt(id,t),k='tsumi:'+id,h=pl.hold[k]||{sh:0,cost:0};h.sh+=sh;h.cost+=use;pl.hold[k]=h;pl.cash-=use;pl.nisa.yT+=use;
       notes.push(`${pre}つみたて設定どおり${S[id].name}を${yen(use)}ぶん自動で購入`);
     }
   }
   const v=pl.bust?pl.hist[pl.hist.length-1]:valueAt(pl,t);pl.hist.push(v);
   if(!pl.bust&&v<pl.start*.1){pl.bust=true;notes.push(`資産が元手の1割を割り込み、破産して退場`)}
 }
 pl.t=T;pl.notes=notes;
 return true;
}

const yen=v=>Math.round(v).toLocaleString('ja-JP')+'円';
const man=v=>Math.abs(v)>=1e8?(v/1e8).toFixed(2).replace(/\.?0+$/,'')+'億円':Math.abs(v)>=1e4?(v/1e4).toFixed(Math.abs(v)>=1e6?0:1).replace(/\.0$/,'')+'万円':yen(v);
const sgnYen=v=>`<span class="${v>=0?'up':'down'}">${v>=0?'+':'−'}${Math.round(Math.abs(v)).toLocaleString('ja-JP')}円</span>`;
const pc=x=>(x>=0?'+':'−')+Math.abs(x*100).toFixed(1)+'%';
const pcs=x=>`<span class="${x>=0?'up':'down'}">${pc(x)}</span>`;
const fp=v=>v>=1000?Math.round(v).toLocaleString('ja-JP'):v.toFixed(1);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function spark(arr,w,h,col){
 const mn=Math.min(...arr),mx=Math.max(...arr),r=mx-mn||1;
 const pts=arr.map((v,i)=>`${(i/(arr.length-1)*w).toFixed(1)},${(h-2-(v-mn)/r*(h-4)).toFixed(1)}`).join(' ');
 return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true"><polyline fill="none" stroke="${col}" stroke-width="1.6" points="${pts}"/></svg>`;
}
function earnIn(s){for(let t=G.t+1;t<=G.t+24;t++){const d=dateOf(t);if(EARN_MONTHS[s.c].includes(d.m)&&earnWeek(s)===d.w)return t-G.t}return 99}

const CH={};
function niceTicks(mn,mx,k){const span=mx-mn||Math.abs(mx)||1;let st=Math.pow(10,Math.floor(Math.log10(span/k)));const e=span/k/st;st*=e>=7.5?10:e>=3.5?5:e>=1.5?2:1;
 const out=[];for(let v=Math.floor(mn/st)*st;v<=mx+st*.5;v+=st)out.push(+v.toFixed(10));return out}
const axYen=v=>Math.abs(v)>=1e8?(v/1e8).toFixed(1).replace(/\.0$/,'')+'億':Math.abs(v)>=1e4?(v/1e4).toFixed(Math.abs(v)>=1e5?0:1).replace(/\.0$/,'')+'万':Math.round(v).toLocaleString('ja-JP');
// o: {series:[{d,c,n,dash}], shade:[0|1|2], marks:[{i,label}], xl:i=>label|null, tip:i=>html, fmt:v=>str, h}
function chart(id,o){CH[id]=o;return `<div class="ch" data-ch="${id}" style="height:${o.h||200}px"></div>`}
function drawCharts(){
 document.querySelectorAll('[data-ch]').forEach(el=>{
   const o=CH[el.dataset.ch];if(!o)return;
   const W=Math.max(260,el.clientWidth||600),H=o.h||200,L=48,Rr=10,T=10,B=22;
   const n=o.series[0].d.length;let mn=Infinity,mx=-Infinity;
   for(const s of o.series)for(const v of s.d)if(v!=null&&isFinite(v)){mn=Math.min(mn,v);mx=Math.max(mx,v)}
   if(!isFinite(mn)){mn=0;mx=1}
   if(o.zero)mn=Math.min(0,mn);
   const pad=(mx-mn)*.06||Math.abs(mx)*.05||1;mn-=o.zero&&mn===0?0:pad;mx+=pad;
   const ticks=niceTicks(mn,mx,4).filter(v=>v>=mn&&v<=mx);
   const X=i=>L+(n<=1?0:i/(n-1))*(W-L-Rr),Y=v=>T+(1-(v-mn)/(mx-mn))*(H-T-B);
   let g='';
   if(o.shade){let st=-1,val=0;for(let i=0;i<=n;i++){const v=i<n?o.shade[i]:0;
     if(v!==val){if(val&&st>=0)g+=`<rect x="${X(st).toFixed(1)}" y="${T}" width="${Math.max(2,X(i-1)-X(st)).toFixed(1)}" height="${H-T-B}" fill="${val===2?'var(--shade2)':'var(--shade)'}"/>`;st=i;val=v}}}
   for(const v of ticks){const y=Y(v).toFixed(1);g+=`<line x1="${L}" x2="${W-Rr}" y1="${y}" y2="${y}" stroke="var(--grid)" stroke-width="1"/><text class="ax" x="${L-6}" y="${(+y+4)}" text-anchor="end">${(o.fmt||axYen)(v)}</text>`}
   let lastX=-99;
   for(let i=0;i<n;i++){const lb=o.xl&&o.xl(i);if(lb&&X(i)-lastX>34){g+=`<line x1="${X(i).toFixed(1)}" x2="${X(i).toFixed(1)}" y1="${T}" y2="${H-B}" stroke="var(--grid)" stroke-width="1"/><text class="ax" x="${X(i).toFixed(1)}" y="${H-6}" text-anchor="middle">${lb}</text>`;lastX=X(i)}}
   if(o.vline!=null&&o.vline>=0&&o.vline<n)g+=`<line x1="${X(o.vline)}" x2="${X(o.vline)}" y1="${T}" y2="${H-B}" stroke="var(--ink)" stroke-width="1.2" stroke-dasharray="2 3"/><text class="ax" x="${X(o.vline)+4}" y="${T+10}">開始</text>`;
   for(const s of o.series){let path='',pen=false;
     s.d.forEach((v,i)=>{if(v==null||!isFinite(v)){pen=false;return}path+=(pen?'L':'M')+X(i).toFixed(1)+','+Y(v).toFixed(1);pen=true});
     g+=`<path d="${path}" fill="none" stroke="${s.c}" stroke-width="${s.w||2}" ${s.dash?'stroke-dasharray="5 4"':''} stroke-linejoin="round"/>`}
   for(const mk of (o.marks||[])){const v=o.series[0].d[mk.i];if(v==null)continue;g+=`<circle cx="${X(mk.i).toFixed(1)}" cy="${Y(v).toFixed(1)}" r="4" fill="var(--gold)" stroke="var(--card)" stroke-width="1.5"/>`}
   const last=o.series[0].d[n-1];if(last!=null)g+=`<circle cx="${X(n-1)}" cy="${Y(last)}" r="3.5" fill="${o.series[0].c}"/>`;
   g+=`<line class="hv" x1="0" x2="0" y1="${T}" y2="${H-B}" stroke="var(--muted)" stroke-width="1" visibility="hidden"/>`;
   el.innerHTML=`<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.label||'チャート')}">${g}</svg><div class="tip" hidden></div>`;
   const svg=el.querySelector('svg'),hv=svg.querySelector('.hv'),tip=el.querySelector('.tip');
   const move=e=>{const r=svg.getBoundingClientRect(),x=e.clientX-r.left;let i=Math.round((x-L)/(W-L-Rr)*(n-1));i=Math.max(0,Math.min(n-1,i));
     hv.setAttribute('x1',X(i));hv.setAttribute('x2',X(i));hv.setAttribute('visibility','visible');
     const mk=(o.marks||[]).filter(m=>Math.abs(m.i-i)<=Math.max(1,n/120));
     tip.innerHTML=(o.tip?o.tip(i):'')+mk.map(m=>`<div>● ${esc(m.label)}</div>`).join('');tip.hidden=false;
     tip.style.left=Math.min(Math.max(0,X(i)+10),W-230)+'px'};
   svg.addEventListener('pointermove',move);svg.addEventListener('pointerdown',move);
   svg.addEventListener('pointerleave',()=>{hv.setAttribute('visibility','hidden');tip.hidden=true});
 });
}

/* ===================== 保存先（オンライン＝Firebase、1台＝この端末） ===================== */
const clone=o=>o==null?o:JSON.parse(JSON.stringify(o));
function setPath(obj,key,val){const ks=key.split('.');let o=obj;for(let i=0;i<ks.length-1;i++){if(typeof o[ks[i]]!=='object'||!o[ks[i]])o[ks[i]]={};o=o[ks[i]]}o[ks[ks.length-1]]=val}
// メモリ上のストア。bus を複数の端末で共有すればテスト用の疑似オンラインにもなる
function MemStore(bus,persist){
 const fire=()=>{if(persist)persist(bus.data);setTimeout(()=>bus.subs.slice().forEach(s=>s()),0)};
 const sub=fn=>{bus.subs.push(fn);setTimeout(fn,0);return ()=>{bus.subs=bus.subs.filter(x=>x!==fn)}};
 return {
  get:async p=>clone(bus.data[p]??null),
  set:async(p,o)=>{bus.data[p]=clone(o);fire()},
  update:async(p,patch)=>{const d=bus.data[p];if(!d)throw new Error('not-found');for(const k in patch)setPath(d,k,clone(patch[k]));fire()},
  watchDoc:(p,cb)=>{let last;return sub(()=>{const s=JSON.stringify(bus.data[p]??null);if(s!==last){last=s;cb(clone(bus.data[p]??null))}})},
  watchCol:(p,cb)=>{let last;return sub(()=>{const pre=p+'/',out=Object.keys(bus.data).filter(k=>k.startsWith(pre)&&!k.slice(pre.length).includes('/')).sort().map(k=>({id:k.slice(pre.length),data:clone(bus.data[k])}));const s=JSON.stringify(out);if(s!==last){last=s;cb(out)}})},
  tx:async(p,fn)=>{const nw=fn(clone(bus.data[p]??null));if(nw){bus.data[p]=clone(nw);fire()}return nw},
 };
}
const LOCAL_KEY='kabutocho-local-v3';

function localStore(){
 if(!LOCAL_BUS){let data={};try{data=JSON.parse(localStorage.getItem(LOCAL_KEY))||{}}catch(e){}LOCAL_BUS={data,subs:[]}}
 return MemStore(LOCAL_BUS,d=>{try{localStorage.setItem(LOCAL_KEY,JSON.stringify(d))}catch(e){}});
}
let ONLINE=null,ONLINE_ERR='';
async function onlineStore(){
 if(ONLINE)return ONLINE;
 if(window.__TEST_BUS__)return ONLINE=MemStore(window.__TEST_BUS__);
 if(!FIREBASE_CONFIG)throw new Error('no-config');
 const V='10.12.2';
 const A=await import(`https://www.gstatic.com/firebasejs/${V}/firebase-app.js`);
 const F=await import(`https://www.gstatic.com/firebasejs/${V}/firebase-firestore.js`);
 const db=F.getFirestore(A.initializeApp(FIREBASE_CONFIG));
 const ref=p=>F.doc(db,p);
 return ONLINE={
  get:async p=>{const s=await F.getDoc(ref(p));return s.exists()?s.data():null},
  set:(p,o)=>F.setDoc(ref(p),o),
  update:(p,o)=>F.updateDoc(ref(p),o),
  watchDoc:(p,cb)=>F.onSnapshot(ref(p),s=>cb(s.exists()?s.data():null),storeError),
  watchCol:(p,cb)=>F.onSnapshot(F.collection(db,p),q=>cb(q.docs.map(d=>({id:d.id,data:d.data()}))),storeError),
  tx:(p,fn)=>F.runTransaction(db,async tr=>{const s=await tr.get(ref(p));const nw=fn(s.exists()?s.data():null);if(nw)tr.set(ref(p),nw);return nw}),
 };
}

const ROOM_CHARS='ABCDEFGHJKMNPQRSTUVWXYZ23456789';
const pid=name=>Array.from(new TextEncoder().encode(name)).map(b=>b.toString(16).padStart(2,'0')).join('');
function cyrb53(str,seed=0){let h1=0xdeadbeef^seed,h2=0x41c6ce57^seed;for(let i=0,ch;i<str.length;i++){ch=str.charCodeAt(i);h1=Math.imul(h1^ch,2654435761);h2=Math.imul(h2^ch,1597334677)}
 h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);return (4294967296*(2097151&h2)+(h1>>>0)).toString(36)}
const hashPin=(code,name,pin)=>cyrb53(`${code}:${name}:${pin}`)+cyrb53(`${pin}:${name}:${code}`,7);
const roomPath=c=>'rooms/'+c,plPath=(c,id)=>`rooms/${c}/players/${id}`;

function sessions(){try{return JSON.parse(localStorage.getItem(SESS_KEY))||[]}catch(e){return []}}
function remember(s){try{const l=sessions().filter(x=>!(x.code===s.code&&x.id===s.id));l.unshift({...s,at:Date.now()});localStorage.setItem(SESS_KEY,JSON.stringify(l.slice(0,6)))}catch(e){}}
function forget(code,id){try{localStorage.setItem(SESS_KEY,JSON.stringify(sessions().filter(x=>!(x.code===code&&x.id===id))))}catch(e){}}

 const id=pid(name),h=hashPin(code,name,pin),seed=Math.floor(Math.random()*4294967296);
 await store.set(roomPath(code),{code,seed,t:0,total:turns,cash,coach,host:id,members:{[id]:{name,color:0,bust:false,order:0}},ready:{},created:Date.now(),v:3});
 await store.set(plPath(code,id),newPlayer(name,h,cash,0,0));

async function joinOnline({code,name,pin}){
 const store=await onlineStore();
 const room=await store.get(roomPath(code));
 if(!room)throw new Error('部屋が見つかりません。部屋コードを確かめてください。');
 const id=pid(name),h=hashPin(code,name,pin);
 const pl=await store.get(plPath(code,id));
 if(pl){if(pl.pin!==h)throw new Error('この名前はもう使われていて、合言葉が違います。自分の名前なら合言葉を確かめて、新しく参加するなら別の名前にしてください。')}
 else{
   if(room.t>=room.total)throw new Error('このゲームはもう終わっています。');
   const n=Object.keys(room.members||{}).length;
   if(n>=8)throw new Error('この部屋は満員です（8人まで）。');
   await store.set(plPath(code,id),newPlayer(name,h,room.cash,room.t,n));
   await store.update(roomPath(code),{[`members.${id}`]:{name,color:n,bust:false,order:n}});
 }
 remember({code,id,name,pin:h});
 enter('online',store,code,[id]);
}

 if(!pl||pl.pin!==s.pin){forget(s.code,s.id);throw new Error('この部屋の記録が見つかりませんでした。部屋コード・名前・合言葉から入り直してください。')}

const membersOrdered=()=>Object.entries(ROOM.members||{}).sort((a,b)=>a[1].order-b[1].order).map(([id,m])=>({id,...m}));
const aliveIds=()=>membersOrdered().filter(m=>!m.bust).map(m=>m.id);
const isOver=()=>ROOM.t>=ROOM.total||aliveIds().length===0;

function onRoom(r){
 if(!r){ui.lobbyMsg='部屋が見つかりませんでした。';quit();return}
 const turnChanged=!ROOM||r.t!==ROOM.t;
 ROOM=r;
 if(!G||G.seed!==r.seed)buildMarket(r.seed);
 extendTo(Math.min(r.t,r.total));
 syncOwned();
 if(r.t>ui.seenT){if(ui.seenT>=0){ui.extra=curNews().find(isMajor)||null;ui.land=true;ui.lesson=null;ui.msg=''}ui.seenT=r.t}

 ui.land=false;

function onPlayers(list){
 let mineChanged=false;
 for(const {id,data} of list){
   if(OWNED.includes(id)&&PLAYERS[id])continue; // 自分の口座は手元の最新を正とする
   PLAYERS[id]=data;if(OWNED.includes(id))mineChanged=true;
 }
 if(!ROOM||!G)return;
 syncOwned();pickMe();
 if(mineChanged||!document.getElementById('bar'))render();else renderBarOnly();
}
// 相場が進んでいたら、自分の口座に配当・積立などを反映して保存
function syncOwned(){
 if(!ROOM||!G)return;
 const T=Math.min(ROOM.t,ROOM.total);
 for(const id of OWNED){const pl=PLAYERS[id];if(!pl)continue;
   if(catchUp(pl,T)){persist(id);if(pl.bust&&!ROOM.members[id]?.bust)STORE.update(roomPath(ROOM.code),{[`members.${id}.bust`]:true}).catch(storeError)}}
}
function pickMe(){

function maybeAdvance(){
 if(isOver())return;
 const alive=aliveIds();
 if(alive.length&&alive.every(id=>ROOM.ready[id]))advance(false);
}
function advance(force){
 const expect=ROOM.t;
 STORE.tx(roomPath(ROOM.code),cur=>{
   if(!cur||cur.t!==expect||cur.t>=cur.total)return null;
   const alive=Object.entries(cur.members).filter(([,m])=>!m.bust).map(([id])=>id);
   if(!force&&!alive.every(id=>cur.ready&&cur.ready[id]))return null;
   return {...cur,t:cur.t+1,ready:{}};
 }).catch(storeError);
}

function trade(side,qty){
 const pl=ME,s=S[ui.sel],a=ui.acct,p=pxJ(s.id),f=feeOf(s,a),k=a+':'+s.id;
 if(!pl||pl.bust)return;
 if(ROOM.ready[MEID])return err('このターンはもう終えています。売買するなら「取り消す」を押してください。');
 qty=side==='buy'?Math.floor(qty):qty;
 if(!(qty>0))return err('数量を1以上で入れてください');
 if(side==='buy'){
   if(!acctOK(s,a))return err(a==='tsumi'?'つみたて投資枠で買えるのは、長期・積立・分散向けの投資信託だけ。このゲームでは日本株・全米株インデックスの2本です。':'このゲームでは金はNISAの対象外にしています。');
   const cost=qty*p,fe=cost*f;
   if(a!=='tok'){const room=nisaRoom(pl,a);if(cost>room+1e-6)return err(`${ACCT[a]}の枠が足りません。今買えるのは${yen(room)}まで（${Math.floor(room/p)}株）。`)}
   if(cost+fe>pl.cash+1e-6)return err(`現金が足りません。最大 ${maxBuy()} 株まで買えます`);
   pl.cash-=cost+fe;pl.fees+=fe;
   const h=pl.hold[k]||{sh:0,cost:0};h.cost+=cost+fe;h.sh+=qty;pl.hold[k]=h;
   if(a==='tsumi')pl.nisa.yT+=cost;if(a==='seicho')pl.nisa.yS+=cost;
   pl.trades++;ok(`${ACCT[a]}で${s.name}を${qty}株買いました（${yen(cost+fe)}${fe?`、うち手数料 ${yen(fe)}`:''}）`);
 }else{
   const h=pl.hold[k];if(!h||h.sh<qty-1e-9)return err(`${ACCT[a]}に持っている数（${h?fsh(h.sh):0}）より多くは売れません`);
   const amt=qty*p,fe=amt*f,avg=h.cost/h.sh,pnl=amt-fe-avg*qty;
   pl.cash+=amt-fe;pl.fees+=fe;
   let extra='';
   if(a==='tok'){const d=realize(pl,pnl);if(d>.5)extra=`、税金 ${yen(d)} を差し引き`;else if(d<-.5)extra=`、今年払った税金から ${yen(-d)} が戻った`}
   else{if(pnl>0){pl.tax.saved+=pnl*TAX;extra=`、NISAなので税金0円（特定口座なら${yen(pnl*TAX)}）`}else if(pnl<0)extra='、NISAの損失は他の利益と相殺できない';
     if(a==='tsumi')pl.nisa.pendT+=avg*qty;else pl.nisa.pendS+=avg*qty}
   h.cost-=avg*qty;h.sh-=qty;if(h.sh<1e-9)delete pl.hold[k];
   pl.trades++;ok(`${s.name}を${fsh(qty)}株売りました。損益 ${sgnYen(pnl)}${extra}`);
 }
 persist(MEID);render();
}
function maxBuy(){const pl=ME,s=S[ui.sel],a=ui.acct,p=pxJ(s.id);
 return Math.max(0,Math.floor(Math.min(pl.cash/(p*(1+feeOf(s,a))),a==='tok'?Infinity:nisaRoom(pl,a)/p)))}

function trackHTML(){
 const y0=Math.floor(G.t/24)*24,sq=[],ms=membersOrdered();
 for(let t=y0;t<y0+24;t++){
   const d=dateOf(t),cls=t<G.t?'past':t===G.t?'now':'';
   const earnJP=EARN_MONTHS.JP.includes(d.m),earnUS=EARN_MONTHS.US.includes(d.m);
   const b=[];
   if(earnJP||earnUS)b.push(`<span class="bd e" title="${earnJP?'日本株':'米国株'}の決算">決</span>`);
   if(d.w===2&&d.m%3===0)b.push(`<span class="bd d" title="配当の権利確定">配</span>`);
   if(d.m===1&&d.w===1)b.push(`<span class="bd n" title="NISAの年間枠リセット">枠</span>`);
   const mk=G.marks[t]&&t<=G.t&&t>0?`<span class="ev ${G.marks[t].mood||''}" title="${esc(G.marks[t].title)}">${esc(G.marks[t].tag)}</span>`:'';
   const tk=t===G.t?`<span class="tok">${ms.filter(m=>!m.bust).slice(0,6).map(m=>`<i style="background:${COLS[m.color%COLS.length]}" title="${esc(m.name)}">${esc([...m.name][0]||'?')}</i>`).join('')}</span>`:'';
   sq.push(`<li class="sq ${cls} ${t===G.t&&ui.land?'land':''}" aria-current="${t===G.t?'step':'false'}"><span class="mo">${d.m}月</span><span class="hf">${HALF(d.w)}</span><div>${b.join('')}</div>${mk}${tk}</li>`);
 }
 // 前半（1〜6月）を左から右、後半（7〜12月）を右から左へ並べて、すごろくの蛇行にする
 const narrow=window.innerWidth<=640;
 const order=narrow?[...sq.slice(0,6),...sq.slice(6,12).reverse(),...sq.slice(12,18),...sq.slice(18).reverse()]:[...sq.slice(0,12),...sq.slice(12).reverse()];
 return `<section class="track" aria-label="今年のすごろく盤"><div class="yrlabel">${dateOf(G.t).y}年のすごろく盤　地上に戻るまであと${ROOM.total-G.t}ターン</div><ol>${order.join('')}</ol>
 <div class="trackleg"><span><b>決</b> 決算シーズン</span><span><b>配</b> 配当の権利確定</span><span><b>枠</b> NISA枠リセット</span><span>マスの下の文字は、そのターンに起きた出来事</span></div></section>`;
}

   const status=m.bust?'破産':ROOM.ready[m.id]?'完了':m.id===MEID?(MODE==='local'?'取引中':'あなた'):'取引中';
   return `<div class="pl ${m.id===MEID?'on':''} ${m.bust?'bust':''} ${ROOM.ready[m.id]?'done':''}"><b><span class="dot" style="background:${COLS[m.color%COLS.length]}"></span>${esc(m.name)}<span class="st">${status}</span></b><span class="v">${yen(v)}</span> ${pcs(v/st-1)}</div>`}).join('');

function maxDD(h){let pk=h[0],dd=0;for(const v of h){pk=Math.max(pk,v);dd=Math.min(dd,v/pk-1)}return dd}
function renderEnd(){

 const ranked=ms.map(m=>({m,p:PLAYERS[m.id],v:fin(m)})).sort((a,b)=>b.v-a.v);

 if(!ui.opened){
   app.innerHTML=`<div class="wrap setup"><div class="hero box-hero"><h1>地上に戻る日が来た</h1><p>${dstr(G.t)}。竜宮城で過ごした${(G.t/24).toFixed(1).replace('.0','')}年のあいだに、あなたの資産はどうなっただろう。</p>
    <button class="go gold" id="open">玉手箱を開ける</button></div></div>`;
   document.getElementById('open').onclick=()=>{ui.opened=true;render()};return;
 }

   const p=r.p,v=r.v,ret=v/p.start-1,bench=benchOf(p)/p.start-1,dd=maxDD(p.hist),out=[];
   out.push(ret>=bench?`同じ期間インデックスを放置した場合（${pc(bench)}）に勝った。プロの運用者でも長期でインデックスに勝ち続けられるのは少数派なので、これは立派な成績。`:`同じ期間インデックスを放置した場合（${pc(bench)}）に負けた。実は多くのプロも同じで、「全体を買って放置」は手強い相手。`);
   out.push(`最大で ${pc(dd)} の下落を経験した。${dd<-.3?'これだけ減ると精神的にきつく、現実では投げ売りしがち。分散やインデックスの比率で揺れを抑える手もある。':'下落を小さめに抑えられた。'}`);
   out.push(`売買は${p.trades}回、手数料は合計${yen(p.fees)}、特定口座で払った税金は${yen(p.tax.total)}。NISAのおかげで払わずに済んだ税金は${yen(p.tax.saved)}。`);
   if(p.divs)out.push(`配当で${yen(p.divs)}受け取った。値上がりだけでなく配当も長期のリターンを支える。`);
   if(p.bust)out.push('破産で退場。一度の大きな損失を取り返すのは難しい。1銘柄への集中は避けたい。');
   return out;
 };

   <div class="form">
    <div><label for="sm">毎月の金額（円）</label><input id="sm" type="number" min="0" step="1000" value="${M}"></div>
    <div><label for="sy">年数</label><input id="sy" type="number" min="1" max="50" value="${Y}"></div>
    <div><label for="sr">年利（%）</label><input id="sr" type="number" min="0" max="20" step="0.5" value="${+sm.r}"></div>
   </div>
   ${c}
   <div class="legend"><span><i style="border-color:var(--up)"></i>評価額</span><span><i class="dash" style="border-color:var(--muted)"></i>元本</span></div>
   <div class="kv">
    <div><small>元本</small><span class="big">${man(P)}</span></div>
    <div><small>NISAなら手取り</small><span class="big">${man(v)}</span></div>
    <div><small>特定口座なら手取り</small><span class="big">${man(v-tax)}</span></div>
    <div><small>NISAで得する額</small><span class="big up">${man(tax)}</span></div>
   </div>
  </div></div>`;
}
function bindNisa(pl){
 document.getElementById('saveplan').onclick=()=>{
   const j=Math.max(0,Math.round(+document.getElementById('pj').value||0)),u=Math.max(0,Math.round(+document.getElementById('pu').value||0));
   if(j+u>100000){ui.msg='つみたて投資枠は年120万円なので、合計で月10万円までにしてください。';ui.err=true;render();return}
   pl.plan={jpidx:j,usidx:u};ui.msg=j+u?`毎月前半に、日本株 ${yen(j)}・全米株 ${yen(u)} を自動で積み立てます。`:'積立を止めました。';ui.err=false;persist(MEID);render()};
 const simIn=(id,key)=>{const el=document.getElementById(id);el.onchange=()=>{ui.sim[key]=el.value;render()}};
 simIn('sm','m');simIn('sy','y');simIn('sr','r');
}

/* ===================== 投資のヒント ===================== */
const LESSONS=10;
function wk(id){const n=idxNow();return pxJ(id)/pxJh(id,n-1)-1}
function tr(id,k=24){const n=idxNow();return pxJ(id)/pxJh(id,Math.max(0,n-k))-1}
const LK=id=>`<button class="lk" data-pick="${id}">${S[id].name}</button>`;
function lesson(i,pl){
 const IND=STOCKS.filter(NONIDX);
 if(i===0){const up=[...IND].sort((a,b)=>tr(b.id)-tr(a.id)),a=up[0],z=up[up.length-1];
  return {t:'株価ボードの読み方',
  body:`<p>見るのは3つ。<b>株価</b>、<b>前回比</b>（2週間前からどれだけ動いたか）、そして<b>1年</b>の小さなグラフ。日本式なので上がりは赤、下がりは青。</p>
  <div class="ex"><b>今の盤面だと</b>${LK(a.id)}は1年で${pcs(tr(a.id))}。グラフが右肩上がりなら「上昇トレンド」。反対に${LK(z.id)}は${pcs(tr(z.id))}で下降トレンド。</div>
  <p>2週間の値動きはほとんどが雑音。銘柄を選ぶと、ゲーム開始前の5年分も含めた長期チャートが見られる。</p>`,
  todo:'銘柄名を押して、チャートの期間を「全期間」にしてみよう。最初から元手を全部使う必要はない。現金を残すのも作戦。'}}
 if(i===1){let m=null;
  for(const n of curNews())for(const x of (n.moves||[]))if(!m||Math.abs(x.pct)>Math.abs(m.pct))m={...x,title:n.title};
  if(!m){const s=[...IND].sort((a,b)=>Math.abs(wk(b.id))-Math.abs(wk(a.id)))[0];m={id:s.id,pct:wk(s.id)}}
  return {t:'ニュースは「動いた後」に届く',
  body:`<p>現実でも、ニュースが出た瞬間に株価は動く。読んでから飛びつくと、もう値段が変わった後で買うことになる。</p>
  <div class="ex"><b>今回の例</b>${LK(m.id)}が${pcs(m.pct)}${m.title?`（${esc(m.title)}）`:''}。考えたいのは「今から買うか」ではなく「この影響は会社の稼ぐ力を変えるか」。</div>
  <p>噂やアナリストの評価、パニック売りは「気分」の話なので、時間がたつと戻りやすい。関税、規制、ヒット商品、不正のように利益そのものを変える話は戻りにくい。</p>`,
  todo:'ニュースの「なぜ動いた？」を開いて、気分の話か、稼ぐ力の話かを自分で判定してみよう。'}}
 if(i===2){const v=value(pl),hs=IND.concat(STOCKS.filter(s=>!NONIDX(s))).map(s=>({id:s.id,w:(holdOf(pl,s.id)?.sh||0)*pxJ(s.id)/v})).filter(x=>x.w>0).sort((a,b)=>b.w-a.w);
  const me=!hs.length?'まだ何も持っていない。':hs[0].w>.5?`今は資産の${Math.round(hs[0].w*100)}%が${LK(hs[0].id)}。この1社に何か起きると、資産の半分以上が揺れる。`:`一番多い${LK(hs[0].id)}でも資産の${Math.round(hs[0].w*100)}%。偏りすぎてはいない。`;
  return {t:'分散：1社に全部賭けない',
  body:`<p>個別株は、不祥事や粉飾が出ると一晩で4割下がることもある。どれだけ有名な会社でも。</p>
  <div class="ex"><b>値動きの荒さを比べると</b>${LK('nvda')}は「激しい」、${LK('ko')}は「小さめ」。${LK('jpidx')}は日本の会社をまとめて持つので、1社の事件ではほとんど動かない。</div>
  <div class="ex"><b>${esc(pl.name)}の今</b>${me}</div>`,
  todo:'「半分はインデックスで土台、残りで気になる個別株に挑戦」のように、守りと攻めを分ける考え方がある。'}}
 if(i===3){const r=IND.map(s=>({s,r:perNow(s.id)/s.pm})).sort((a,b)=>b.r-a.r),hi=r[0],lo=r[r.length-1];
  return {t:'割高・割安をPERで見る',
  body:`<p>株価は「1株利益 × PER」で決まる。PERは「利益の何年分の値段がついているか」で、みんなの期待が大きいほど高くなる。</p>
  <div class="ex"><b>いちばん割高気味</b>${LK(hi.s.id)}はPER ${perNow(hi.s.id).toFixed(1)}倍で、過去平均（${hi.s.pm}倍）の${hi.r.toFixed(2)}倍。</div>
  <div class="ex"><b>いちばん割安気味</b>${LK(lo.s.id)}はPER ${perNow(lo.s.id).toFixed(1)}倍で、過去平均（${lo.s.pm}倍）の${lo.r.toFixed(2)}倍。</div>
  <p>チャートの点線「理論株価の目安」は、1株利益に平均PERをかけた値。株価が点線より大きく上なら期待が先行、下なら悲観が強い。ただし安いのには理由があることも多い（利益が減り続けている、など）。</p>`,
  todo:'気になる銘柄のチャートで、株価と点線の離れ具合と、「業績の記録」の伸びを見比べよう。'}}
 if(i===4){const s=[...IND].sort((a,b)=>earnIn(a)-earnIn(b))[0];
  return {t:'決算は「予想とのズレ」で動く',
  body:`<p>決算で株価が動くのは、利益が多いからではなく、みんなの予想より多かったか少なかったか。予想通りならあまり動かない。</p>
  <div class="ex"><b>次に決算が来るのは</b>${LK(s.id)}で${earnIn(s)===1?'次のターン':nextEarn(s)}。好決算でも、期待で先に買われていると発表と同時に売られる（材料出尽くし）。このゲームでも起きる。</div>
  <p>すごろく盤の「決」のマスが決算シーズン。銘柄カルテの「業績の記録」で、過去の決算が予想を上回ったか（赤）下回ったか（青）が見られる。</p>`,
  todo:'決算をまたいで持つなら、外れても耐えられる量にとどめる。'}}
 if(i===5){const dips=IND.filter(s=>tr(s.id)>.08&&wk(s.id)<-.02).sort((a,b)=>wk(a.id)-wk(b.id)),knives=IND.filter(s=>tr(s.id)<-.15).sort((a,b)=>tr(a.id)-tr(b.id));
  return {t:'押し目と「落ちてくるナイフ」',
  body:`<p>よく使われる経験則がある（当たる保証はない）。上昇トレンドの途中で一時的に下げたところは<b>押し目</b>と呼ばれ、買い候補になる。下がり続けている株を「安くなったから」と買うのは<b>落ちてくるナイフをつかむ</b>と言われ、さらに下がりやすい。</p>
  <div class="ex"><b>押し目の形</b>${dips.length?`${LK(dips[0].id)}は1年で${pcs(tr(dips[0].id))}の上昇中、今回は${pcs(wk(dips[0].id))}。`:'今の盤面にはきれいな押し目がない。条件がそろわないときは待つのも判断。'}</div>
  <div class="ex"><b>ナイフの形</b>${knives.length?`${LK(knives[0].id)}は1年で${pcs(tr(knives[0].id))}。業績の記録で利益が減り続けていないか確認してから。`:'大きく下げ続けている銘柄は今はない。'}</div>`,
  todo:'買う前に「なぜ今この値段なのか」を一言で説明できるか確かめる。説明できなければ見送り。'}}
 if(i===6){const hy=[...IND].sort((a,b)=>b.y-a.y).slice(0,3);
  return {t:'配当：持っているだけでもらえる現金',
  body:`<p>配当は株を持っている人に会社が払うお金。日本株は3月・9月、米国株は3・6・9・12月の後半に確定する（すごろく盤の「配」のマス）。</p>
  <div class="ex"><b>利回りが高いのは</b>${hy.map(s=>`${LK(s.id)} ${(s.y*100).toFixed(1)}%`).join('、')}。利回り3%なら、300万円で年に約9万円。特定口座だとそこから約1.8万円が税金で引かれる。</div>
  <p>権利が確定すると、配当の分だけ株価が下がる（権利落ち）。直前に買ってすぐ売っても得はしない。長く持つ人へのごほうび。</p>`,
  todo:'長く持つ候補は、配当利回りと値動きの荒さを両方見て選ぶ。'}}
 if(i===7){const usd=G.st.aapl.p,y0=usd*G.fx,y1=usd*(G.fx-10);
  return {t:'為替も損益を動かす',
  body:`<p>米国株と金はドルで値段がつく。株価が変わらなくても、円安なら円で見た資産は増え、円高なら減る。</p>
  <div class="ex"><b>計算してみると</b>${LK('aapl')}は$${usd.toFixed(2)}、今の1ドル＝${G.fx.toFixed(1)}円で${fp(y0)}円。10円円高になると、株価が同じでも${fp(y1)}円（${pcs(y1/y0-1)}）。</div>`,
  todo:'「相場の歴史」タブで、ドル円の長い動きを見てみよう。日本株と米国株を両方持つと、為替の影響が和らぎやすい。'}}
 if(i===8){return {t:'NISA：利益に税金がかからない口座',
  body:`<p>普通の口座（特定口座）では、売って出た利益と配当に20.315%の税金がかかる。10万円もうけたら約2万円が引かれる。NISAの口座の中なら0円。</p>
  <div class="ex"><b>${esc(pl.name)}の今</b>特定口座で払った税金は累計${yen(pl.tax.total)}、NISAで払わずに済んだ税金は${yen(pl.tax.saved)}。</div>
  <p>ただしNISAには年間と生涯の上限があり、損失が出ても他の利益と相殺できない。値動きの激しい株で大損するとNISAの得が消える。</p>`,
  todo:'銘柄カルテの口座ボタンで「NISA成長投資枠」を選んで買える。「NISA・税金」タブでは毎月の自動積立も設定できる。'}}
 const loss=holds(pl).map(h=>({id:h.id,r:h.sh*pxJ(h.id)/h.cost-1})).sort((a,b)=>a.r-b.r);
 return {t:'下がったときにどうするか',
  body:`<p>一番損をしやすいのは、暴落でパニックになって底で売ること（狼狽売り）。2008年も2020年も、相場はその後に回復した。判断の基準は「買った理由がまだ生きているか」。</p>
  <div class="ex"><b>${esc(pl.name)}の今</b>${loss.length&&loss[0].r<0?`${LK(loss[0].id)}が${pcs(loss[0].r)}の含み損。利益（業績の記録）は減っている？ 減っていないなら気分の下げかもしれない。`:'今は含み損の銘柄はない。下がる前に「−15%になったら理由を見直す」のようなルールを決めておくと、いざというとき迷わない。'}</div>`,
  todo:'ヒントはこれで最後。ここからは自分の判断で。ヘッダーの「ヒント」でいつでも見返せる。'};
}
function coachCard(pl){
 const auto=ROOM.coach&&G.t-ME.joinT<LESSONS&&!ME.coachOff;
 if(!auto&&!ui.coachOpen)return '';
 const i=ui.lesson??Math.min(Math.max(G.t-ME.joinT,0),LESSONS-1),L=lesson(i,pl);
 return `<div class="card coach" aria-label="投資のヒント"><span class="step">ヒント ${i+1}/${LESSONS}</span><h2>${L.t}</h2>${L.body}<p><b>やってみよう：</b>${L.todo}</p>
 <div class="coachbar"><button class="btn ghost" data-cl="-1" ${i?'':'disabled'}>前のヒント</button><button class="btn ghost" data-cl="1" ${i<LESSONS-1?'':'disabled'}>次のヒント</button><span class="spacer"></span><button class="linkbtn" id="coachx">ヒントを閉じる</button></div></div>`;
}

/* ===================== 起動 ===================== */
(function boot(){
 const h=(location.hash||'').slice(1).toUpperCase();
 const s=h&&sessions().find(x=>x.code===h);
 if(s&&(FIREBASE_CONFIG||window.__TEST_BUS__))resumeOnline(s).catch(e=>{ui.lobbyMsg=e.message;render()});
 else render();
})();

</script>
</body>
</html>
